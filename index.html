<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cidade de Indicadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cena isométrica à esquerda, painel da área selecionada à direita; empilha no celular. Tema único noturno. */
:root{
  color-scheme: dark;
  --bg:#0a111c; --surface:#101b2a; --surface2:#16253a; --line:#22344d;
  --text:#e6edf6; --muted:#8fa3bb;
  --good:#5ad1a0; --bad:#ff7a7a; --flat:#9db0c6;
  --display:'Sora','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:1280px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.top h1{font-family:var(--display);font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:0;color:var(--muted)}
.badge{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.scene{overflow:hidden}
#city{display:block;width:100%;height:auto;background:#0d1626}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.tab{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:500;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--ac)}
.tab:hover{border-color:var(--ac)}
.tab[aria-pressed="true"]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.tab:focus-visible,.bld:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* cena */
.bld{cursor:pointer;transition:transform .25s ease,filter .25s ease;outline:none}
.bld:hover,.bld:focus-visible{transform:translateY(-6px);filter:brightness(1.12)}
.bld.sel{filter:drop-shadow(0 0 12px var(--ac))}
.tag rect,.tag path{fill:#0e1828;stroke:var(--ac);stroke-width:1.5}
.tag path{stroke:none}
.tag text{fill:#e6edf6;font:600 13px var(--display)}
.bld.sel .tag rect,.bld.sel .tag path{fill:var(--ac)}
.bld.sel .tag text{fill:#08101b}
.bld:focus-visible .tag rect{stroke-width:3;stroke:#fff}
.steam circle{fill:#f4efe6;animation:rise 3s ease-out infinite}
.steam circle:nth-child(2){animation-delay:-1s}
.steam circle:nth-child(3){animation-delay:-2s}
@keyframes rise{from{transform:translateY(0);opacity:.75}to{transform:translateY(-24px);opacity:0}}
.beacon{animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* painel */
.panel{padding:20px;display:flex;flex-direction:column;gap:18px}
.panel > *{animation:enter .3s ease both}
@keyframes enter{from{opacity:.35;transform:translateY(6px)}}
.ph{display:flex;gap:12px;align-items:center}
.ph .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--ac)}
.ph h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lb{font-size:13px;color:var(--muted)}
.kpi .vl{font-family:var(--display);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.kpi .rw{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.good{color:var(--good);background:rgba(90,209,160,.14)}
.pill.bad{color:var(--bad);background:rgba(255,122,122,.14)}
.pill.flat{color:var(--flat);background:rgba(157,176,198,.14)}
.chartcard{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px}
.chartcard h3{margin:0 0 6px;font-size:14px;font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:18px;height:8px}
.chartcard svg.ch{width:100%;height:auto;display:block}
.grid-l{stroke:#2a3d57;stroke-width:1;stroke-dasharray:2 4}
.ax{fill:var(--muted);font:11px var(--body);font-variant-numeric:tabular-nums}
.val{font:600 11px var(--body);font-variant-numeric:tabular-nums}
.note{margin:6px 0 0;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .badge{margin-left:0}
}
@media (max-width:420px){
  .kpi .vl{font-size:20px}
  .panel{padding:14px}
}
@media (prefers-reduced-motion:reduce){
  .bld,.panel > *{transition:none;animation:none}
  .beacon{animation:none}
  .steam circle{animation:none;opacity:.5}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Cidade de Indicadores</h1>
    <p>Clique em um prédio para abrir o painel da área.</p>
    <span class="badge">Dados fictícios de demonstração</span>
  </header>
  <main class="grid">
    <section class="scene card" aria-label="Cidade">
      <svg id="city" viewBox="0 0 800 690" role="group" aria-label="Mapa da cidade com três prédios: Governança, Café e Carteira"></svg>
      <nav class="tabs" id="tabs" aria-label="Áreas"></nav>
    </section>
    <aside class="panel card" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script>
/* ---------- dados (fictícios) ---------- */
const M8=['Mar','Abr','Mai','Jun','Jul','Ago','Set','Out'];
const M12=['Nov','Dez','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out'];
const AREAS={
  gov:{name:'Governança',sub:'Fila de chamados do mês corrente',color:'#5aa9ff',
    kpis:[
      {l:'Chamados abertos',v:'128',d:'+9%',t:'flat',s:[96,104,99,112,108,121,117,128]},
      {l:'Atendidos',v:'82',d:'64%',t:'good',s:[90,98,95,103,101,109,106,82]},
      {l:'Em atendimento',v:'31',d:'−3%',t:'flat',s:[28,34,30,36,33,35,32,31]},
      {l:'Pendentes',v:'15',d:'+18%',t:'bad',s:[8,9,9,11,10,12,13,15]}],
    chart:{type:'bars',title:'Chamados abertos x atendidos por mês',cats:M8,
      series:[{n:'Abertos',d:[96,104,99,112,108,121,117,128]},{n:'Atendidos',d:[90,98,95,103,101,109,106,82]}],
      note:'Outubro em andamento: atendidos ainda parciais.'}},
  cafe:{name:'Café',sub:'Operação do mês corrente · valores em R$',color:'#f2a65a',
    kpis:[
      {l:'Aporte',v:'R$ 85 mil',d:'+6%',t:'flat',s:[70,72,68,75,78,74,80,85]},
      {l:'Faturamento',v:'R$ 412 mil',d:'+11%',t:'good',s:[340,355,348,372,380,365,390,412]},
      {l:'Venda agregada',v:'R$ 1,28 mi',d:'+8%',t:'good',s:[1010,1060,1040,1120,1150,1100,1190,1280]},
      {l:'Cobertura',v:'18 dias',d:'−3 dias',t:'bad',s:[26,25,24,23,22,21,21,18]}],
    chart:{type:'lines',title:'Faturamento x aporte (R$ mil)',cats:M12,
      series:[{n:'Faturamento',d:[310,322,305,340,355,348,372,380,365,390,401,412]},{n:'Aporte',d:[70,72,68,75,78,74,80,82,79,83,80,85]}]}},
  cart:{name:'Carteira',sub:'Resultado do mês corrente · valores em R$',color:'#b48cff',
    kpis:[
      {l:'Estoque',v:'R$ 3,8 mi',d:'+4%',t:'flat',s:[3300,3400,3350,3500,3550,3600,3700,3800]},
      {l:'Vendas',v:'R$ 2,1 mi',d:'+9%',t:'good',s:[1820,1900,1960,1930,2010,2050,2080,2100]},
      {l:'Lucro',v:'R$ 486 mil',d:'+12%',t:'good',s:[402,430,448,440,462,474,480,486]},
      {l:'Imposto',v:'R$ 312 mil',d:'+7%',t:'flat',s:[262,276,284,280,298,304,308,312]}],
    chart:{type:'lines',title:'Lucro x imposto (R$ mil)',cats:M12,
      series:[{n:'Lucro',d:[360,372,350,395,410,402,430,448,440,462,474,486]},{n:'Imposto',d:[236,244,230,255,266,262,276,284,280,298,304,312]}]}}
};

/* ---------- geometria isométrica ---------- */
const S=36, OX=400, OY=280, G=10;
const P=(x,y,z=0)=>[+(OX+(x-y)*0.866*S).toFixed(1), +(OY+(x+y)*0.5*S-z*S).toFixed(1)];
const pts=a=>a.map(q=>P(...q).join(',')).join(' ');
const poly=(a,fill,extra='')=>`<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`;
const rnd=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
function box(x,y,w,d,h,c,z0=0){
  return poly([[x,y+d,z0],[x+w,y+d,z0],[x+w,y+d,z0+h],[x,y+d,z0+h]],c.left)
       + poly([[x+w,y,z0],[x+w,y+d,z0],[x+w,y+d,z0+h],[x+w,y,z0+h]],c.right)
       + poly([[x,y,z0+h],[x+w,y,z0+h],[x+w,y+d,z0+h],[x,y+d,z0+h]],c.top);
}
function win(face,B,cols,rows,zb,zt,seed){
  let o='';const rh=(zt-zb)/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const f0=(c+.2)/cols,f1=(c+.8)/cols,z0=zb+r*rh+rh*.2,z1=zb+r*rh+rh*.78;
    const on=rnd(seed+r*17+c*5+(face==='R'?3:0))>.38;
    let q;
    if(face==='L'){const yy=B.y+B.d;q=[[B.x+B.w*f0,yy,z0],[B.x+B.w*f1,yy,z0],[B.x+B.w*f1,yy,z1],[B.x+B.w*f0,yy,z1]];}
    else{const xx=B.x+B.w;q=[[xx,B.y+B.d*f0,z0],[xx,B.y+B.d*f1,z0],[xx,B.y+B.d*f1,z1],[xx,B.y+B.d*f0,z1]];}
    o+=poly(q,on?'#ffd98a':'#0a121e',on?'fill-opacity=".92"':'fill-opacity=".45"');
  }
  return o;
}
function tag(name,cx,cy,z){
  const [px,py]=P(cx,cy,z), w=name.length*8.4+28;
  return `<g class="tag" transform="translate(${px},${py})"><rect x="${-w/2}" y="-14" width="${w}" height="28" rx="14"/><path d="M-6 13 L6 13 L0 21Z"/><text y="5" text-anchor="middle">${name}</text></g>`;
}
function tree(x,y,s=1){
  const [px,py]=P(x,y,0);
  return `<ellipse cx="${px}" cy="${py+2}" rx="${12*s}" ry="${6*s}" fill="#000" opacity=".3"/><rect x="${px-2}" y="${py-14*s}" width="4" height="${14*s}" fill="#5b4636"/><ellipse cx="${px}" cy="${py-26*s}" rx="${14*s}" ry="${17*s}" fill="#2c6a52"/><ellipse cx="${px-3*s}" cy="${py-30*s}" rx="${8*s}" ry="${10*s}" fill="#3a8466"/>`;
}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v*f));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');}

/* ---------- prédios ---------- */
function bGov(){
  const B={x:1.5,y:1.5,w:2.6,d:2.6}, h=6.5, c={top:'#8db3e0',left:'#4d77a6',right:'#37577f'};
  const [ax,ay]=P(2.8,2.8,h+.7), [bx,by]=P(2.8,2.8,h+2.2);
  return box(B.x,B.y,B.w,B.d,h,c)+win('L',B,5,9,.7,h-.4,11)+win('R',B,5,9,.7,h-.4,29)
    +box(2.1,2.1,1.4,1.4,.7,{top:'#a4c4ea',left:'#5a85b6',right:'#406591'},h)
    +`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#9db6d4" stroke-width="2"/><circle class="beacon" cx="${bx}" cy="${by}" r="3.5" fill="#ff6b6b"/>`
    +tag('Governança',2.8,2.8,h+3.3);
}
function bCafe(){
  const B={x:6,y:1.5,w:2.6,d:2.4}, h=2.2, c={top:'#eab883',left:'#c98a4f',right:'#a06b3a'};
  let o=box(B.x,B.y,B.w,B.d,h,c)+win('L',B,3,1,1.35,2.0,41)+win('R',B,2,1,.8,1.8,53);
  const yy=B.y+B.d, sw=B.w/6;
  for(let i=0;i<6;i++){
    const x0=B.x+i*sw;
    o+=poly([[x0,yy,1.2],[x0+sw,yy,1.2],[x0+sw,yy+.5,.85],[x0,yy+.5,.85]],i%2?'#f2e9dc':'#e07a5f');
  }
  o+=poly([[B.x+1.0,yy,0],[B.x+1.6,yy,0],[B.x+1.6,yy,.85],[B.x+1.0,yy,.85]],'#3a2616');
  o+=box(5.9,1.4,2.8,2.6,.2,{top:'#f0c595',left:'#a8703d',right:'#835629'},h);
  o+=box(7.7,1.8,.45,.45,.9,{top:'#b9916b',left:'#8d6a47',right:'#6e5136'},h+.2);
  const [sx,sy]=P(7.92,2.02,h+1.2);
  o+=`<g class="steam"><circle cx="${sx}" cy="${sy}" r="5"/><circle cx="${sx+3}" cy="${sy}" r="4"/><circle cx="${sx-2}" cy="${sy}" r="3.5"/></g>`;
  return o+tag('Café',7.3,2.7,h+2.2);
}
function bCart(){
  const B={x:1.5,y:6,w:2.6,d:2.6}, h=4, c={top:'#c3aef5',left:'#8a73c9',right:'#6a58a3'};
  let o=box(B.x,B.y,B.w,B.d,h,c)+win('L',B,4,3,1.0,3.6,67)+win('R',B,4,3,1.0,3.6,83);
  const yy=B.y+B.d;
  o+=poly([[B.x+1.0,yy,0],[B.x+1.6,yy,0],[B.x+1.6,yy,.85],[B.x+1.0,yy,.85]],'#241a3d');
  o+=box(1.4,5.9,2.8,2.8,.3,{top:'#d2c2f8',left:'#7660b3',right:'#5a4a8c'},h);
  const [cx,cy]=P(2.8,7.3,h+.3), [kx,ky]=P(2.8,7.3,h+1.6);
  o+=`<line x1="${cx}" y1="${cy}" x2="${kx}" y2="${ky+4}" stroke="#a89bd0" stroke-width="3"/>`
    +`<ellipse cx="${kx}" cy="${ky+5}" rx="23" ry="13" fill="#b8860b"/><ellipse cx="${kx}" cy="${ky}" rx="23" ry="13" fill="#f2c14e"/><ellipse cx="${kx}" cy="${ky}" rx="17" ry="9" fill="none" stroke="#b8860b" stroke-width="1.5"/><text x="${kx}" y="${ky+4.5}" text-anchor="middle" font-family="Sora,sans-serif" font-weight="700" font-size="13" fill="#7a5a10">$</text>`;
  return o+tag('Carteira',2.8,7.3,h+3.1);
}

/* ---------- cena ---------- */
const BUILD={gov:{k:5.6,f:bGov},cafe:{k:10,f:bCafe},cart:{k:10.1,f:bCart}};
let stars='';
for(let i=0;i<40;i++){stars+=`<circle cx="${(rnd(i+1)*800).toFixed(0)}" cy="${(rnd(i+90)*150).toFixed(0)}" r="${(0.6+rnd(i+7)*1.1).toFixed(1)}" fill="#cfe0f5" opacity="${(0.25+rnd(i+3)*0.6).toFixed(2)}"/>`;}
function pad(x0,y0,x1,y1,ac){return poly([[x0,y0,0],[x1,y0,0],[x1,y1,0],[x0,y1,0]],'#22364a',`stroke="${ac}" stroke-opacity=".45" stroke-width="1.5"`);}
function buildScene(){
  let o=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1120"/><stop offset="1" stop-color="#17294a"/></linearGradient></defs><rect width="800" height="690" fill="url(#sky)"/>${stars}<circle cx="690" cy="70" r="26" fill="#e9eef7" opacity=".92"/><circle cx="700" cy="64" r="22" fill="#0f1b33" opacity=".35"/>`;
  o+=box(0,0,G,G,.6,{top:'#1b2c33',left:'#131e28',right:'#0f1822'},-.6);
  o+=pad(1.2,1.2,4.4,4.4,AREAS.gov.color)+pad(5.8,1.2,8.9,4.2,AREAS.cafe.color)+pad(1.2,5.7,4.4,8.9,AREAS.cart.color);
  o+=poly([[4.6,0,0],[5.4,0,0],[5.4,G,0],[4.6,G,0]],'#2b3644')+poly([[0,4.6,0],[G,4.6,0],[G,5.4,0],[0,5.4,0]],'#2b3644');
  const dash='fill="none" stroke="#d7b95e" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="6 8"';
  o+=`<polyline points="${pts([[5,0,0],[5,G,0]])}" ${dash}/><polyline points="${pts([[0,5,0],[G,5,0]])}" ${dash}/>`;
  o+=poly([[6,6,0],[9,6,0],[9,9,0],[6,9,0]],'#223a4a','stroke="#3b5a70" stroke-width="1.5"');
  const [fx,fy]=P(7.5,7.5,0);
  o+=`<ellipse cx="${fx}" cy="${fy+3}" rx="36" ry="20" fill="#16222f"/><ellipse cx="${fx}" cy="${fy}" rx="34" ry="19" fill="#3a5f80"/><ellipse cx="${fx}" cy="${fy}" rx="24" ry="13" fill="#5b94c4"/><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${fy-18}" stroke="#bfe0f7" stroke-width="3" stroke-linecap="round"/><circle cx="${fx}" cy="${fy-19}" r="3.5" fill="#bfe0f7"/>`;
  o+='<g id="cars"></g>';
  const items=[];
  [[.7,3.9],[4.1,.7],[9.3,.7],[9.3,4.2],[.7,9.3],[4.1,9.3],[9.3,9.3],[5.9,9.3],[.7,.7]].forEach(([x,y],i)=>items.push({k:x+y,s:tree(x,y,.9+rnd(i)*.25)}));
  Object.entries(BUILD).forEach(([id,b])=>{
    const a=AREAS[id];
    items.push({k:b.k,s:`<g class="bld" data-id="${id}" style="--ac:${a.color}" tabindex="0" role="button" aria-label="Abrir painel de ${a.name}">${b.f()}</g>`});
  });
  items.sort((a,b)=>a.k-b.k);
  return o+items.map(i=>i.s).join('');
}
document.getElementById('city').innerHTML=buildScene();

/* carros */
const CARS=[{a:'y',l:4.82,t0:1,v:.9,d:1,c:'#f2c14e'},{a:'y',l:5.18,t0:6,v:.7,d:-1,c:'#e8edf5'},{a:'x',l:4.82,t0:3,v:.8,d:1,c:'#e07a5f'},{a:'x',l:5.18,t0:8,v:1,d:-1,c:'#8ecae6'}];
const carsG=document.getElementById('cars');
function drawCars(ts){
  const t=ts/1000;
  carsG.innerHTML=CARS.map(c=>{
    const p=(((c.t0+c.d*c.v*t)%G)+G)%G;
    return c.a==='y'?{k:c.l+p,x:c.l,y:p,c}:{k:c.l+p,x:p,y:c.l,c};
  }).sort((a,b)=>a.k-b.k).map(({x,y,c})=>{
    const w=c.a==='y'?.38:.72, d=c.a==='y'?.72:.38;
    return box(x-w/2,y-d/2,w,d,.3,{top:c.c,left:shade(c.c,.78),right:shade(c.c,.6)});
  }).join('');
}
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(still){drawCars(0);}else{const loop=ts=>{drawCars(ts);requestAnimationFrame(loop)};requestAnimationFrame(loop);}

/* ---------- gráficos do painel ---------- */
const nf=n=>n.toLocaleString('pt-BR');
function niceMax(v){
  const raw=v/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  const step=[1,1.25,1.5,2,2.5,3,4,5,6,8,10].find(s=>s>=n-1e-9)*mag;
  return step*4;
}
function spark(d,color){
  const w=84,h=30,mn=Math.min(...d),mx=Math.max(...d);
  const p=d.map((v,i)=>[+(2+i*(w-4)/(d.length-1)).toFixed(1),+(h-4-(v-mn)/((mx-mn)||1)*(h-10)).toFixed(1)]);
  const line=p.map((q,i)=>(i?'L':'M')+q.join(' ')).join('');
  const l=p[p.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${line}L${l[0]} ${h}L${p[0][0]} ${h}Z" fill="${color}" fill-opacity=".16"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${l[0]}" cy="${l[1]}" r="3" fill="${color}"/></svg>`;
}
function chartSVG(ch,ac){
  const W=520,H=230,L=46,R=16,T=18,B=26, iw=W-L-R, ih=H-T-B;
  const max=niceMax(Math.max(...ch.series.flatMap(s=>s.d)));
  const y=v=>T+ih-(v/max)*ih, n=ch.cats.length, col=[ac,'#9db0c6'];
  let g='';
  for(let i=0;i<=4;i++){const v=max/4*i;g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`;}
  const step=iw/n;
  ch.cats.forEach((c,i)=>{g+=`<text class="ax" x="${L+step*(i+.5)}" y="${H-8}" text-anchor="middle">${c}</text>`;});
  if(ch.type==='bars'){
    const bw=step*.3;
    ch.series.forEach((s,si)=>s.d.forEach((v,i)=>{
      const x0=L+step*(i+.5), x=si?x0+1:x0-bw-1;
      g+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T+ih-y(v)).toFixed(1)}" rx="2" fill="${col[si]}"><title>${s.n} · ${ch.cats[i]}: ${nf(v)}</title></rect>`;
      if(i===n-1)g+=`<text class="val" x="${(x+bw/2).toFixed(1)}" y="${y(v)-5}" text-anchor="middle" fill="${col[si]}">${nf(v)}</text>`;
    }));
  }else{
    ch.series.forEach((s,si)=>{
      const p=s.d.map((v,i)=>[+(L+step*(i+.5)).toFixed(1),+y(v).toFixed(1)]);
      const line=p.map((q,i)=>(i?'L':'M')+q.join(' ')).join('');
      if(si===0)g+=`<path d="${line}L${p[n-1][0]} ${T+ih}L${p[0][0]} ${T+ih}Z" fill="${col[0]}" fill-opacity=".14"/>`;
      g+=`<path d="${line}" fill="none" stroke="${col[si]}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" ${si?'stroke-dasharray="6 4"':''}/>`;
      p.forEach((q,i)=>{g+=`<circle cx="${q[0]}" cy="${q[1]}" r="${i===n-1?4:8}" fill="${i===n-1?col[si]:'transparent'}"><title>${s.n} · ${ch.cats[i]}: ${nf(s.d[i])}</title></circle>`;});
      const e=p[n-1];
      g+=`<text class="val" x="${e[0]}" y="${si?e[1]+16:e[1]-9}" text-anchor="end" fill="${col[si]}">${nf(s.d[n-1])}</text>`;
    });
  }
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${ch.title}">${g}</svg>`;
}
const ARROW={good:'▲',bad:'▼',flat:'●'};
function renderPanel(id){
  const a=AREAS[id], ch=a.chart;
  const sw=(c,dash)=>`<svg viewBox="0 0 18 8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" stroke="${c}" stroke-width="3" ${dash?'stroke-dasharray="5 3"':''}/></svg>`;
  document.getElementById('panel').style.setProperty('--ac',a.color);
  document.getElementById('panel').innerHTML=
   `<div class="ph"><span class="bar"></span><div><h2>${a.name}</h2><p>${a.sub}</p></div></div>
    <div class="kpis">${a.kpis.map(k=>`<div class="kpi"><span class="lb">${k.l}</span><span class="vl">${k.v}</span><div class="rw"><span class="pill ${k.t}">${ARROW[k.t]} ${k.d}</span>${spark(k.s,a.color)}</div></div>`).join('')}</div>
    <section class="chartcard"><h3>${ch.title}</h3>
      <div class="legend"><span>${sw(a.color)}${ch.series[0].n}</span><span>${sw('#9db0c6',ch.type==='lines')}${ch.series[1].n}</span></div>
      ${chartSVG(ch,a.color)}${ch.note?`<p class="note">${ch.note}</p>`:''}</section>`;
}

/* ---------- seleção ---------- */
let current=null;
const tabs=document.getElementById('tabs');
tabs.innerHTML=Object.entries(AREAS).map(([id,a])=>`<button class="tab" type="button" data-id="${id}" style="--ac:${a.color}" aria-pressed="false"><i></i>${a.name}</button>`).join('');
function select(id){
  if(!AREAS[id]||id===current)return;
  current=id;
  document.querySelectorAll('.bld').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));
  renderPanel(id);
  try{ if(location.hash!=='#'+id) location.hash=id; }catch(e){}
}
document.getElementById('city').addEventListener('click',e=>{const b=e.target.closest('.bld');if(b)select(b.dataset.id);});
document.getElementById('city').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const b=e.target.closest('.bld');if(b){e.preventDefault();select(b.dataset.id);}
});
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)select(b.dataset.id);});
window.addEventListener('hashchange',()=>select(location.hash.slice(1)));
select(AREAS[location.hash.slice(1)]?location.hash.slice(1):'gov');
</script>
